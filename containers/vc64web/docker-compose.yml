services:
  c64:
    build:
      context: .
      additional_contexts:
        pages: ./out          # pages generated by build.py (--out)
    image: c64d
    init: true
    shm_size: 1gb
    restart: unless-stopped
    ports:
      - "127.0.0.1:7064:7064"   # localhost only: the daemon has no authentication (c64.eval runs JS in the page)
    volumes:
      - ./work/games:/games          # game files: .d64 .g64 .prg .t64 .crt ...   (c64 games / c64 game NAME)
      - ./work/roms:/roms            # extra ROMs besides those of the repo          (c64 roms / c64 rom kernal NAME)
      - ./work/scripts:/scripts:ro   # input scripts
      - ./output:/output        # files produced by the scripts (--outdir /output)
# usage:  docker compose exec c64 node headless/c64 start
#         docker compose exec c64 node headless/c64 --outdir /output script /scripts/example.txt
