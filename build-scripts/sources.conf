# Lab64 sources (14/11, owner's rule): EVERY external program comes from here, at the LATEST version found on 14/11/2026.
# Copyright (c) 2026 - Simone Caporale
# Read by build-images.sh (sh variables). It downloads each source ON THE HOST into downloads/ (curl or git: the computer's
# certificates and proxy), checks it, passes it to docker/Dockerfile as the build context "downloads", and deletes it once the
# images exist. The programs are compiled from source in the *-build stages: only the binaries (and the license) go into the images.
#
# Per program:  <NAME>_VERSION   version (in the file names and in the image)
#               <NAME>_URL + <NAME>_SHA256          a file (tar.gz, zip, deb), checked with SHA-256
#               <NAME>_GIT + <NAME>_REF             a git repository at a fixed commit (no release with sources): archived as tar.gz
# To update a program: change version, URL / commit and SHA-256 here, then build-scripts/build-images.sh --force.

# VICE: reference emulator (x64sc, c1541). Latest release: 3.10. GPL-2.0.
VICE_VERSION=3.10
VICE_URL=https://sourceforge.net/projects/vice-emu/files/releases/vice-3.10.tar.gz/download
VICE_SHA256=8e5bac18cbcb9f192380ad3ef881f8790f5b75c41d7b3da65d831985d864d6d1

# 64tass: 6502 assembler. Latest source release: 1.60.3243 (05/2025). GPL-2.0.
TASS64_VERSION=1.60.3243
TASS64_URL=https://sourceforge.net/projects/tass64/files/source/64tass-1.60.3243-src.zip/download
TASS64_SHA256=9d83be3d23a2c55e085b7c7a7856c2f96080447ea120a6a8c21a217ed76427f0

# cc65: C compiler, ca65 assembler, ld65 linker (used to build Krill's Loader). Release V2.19 (30/05/2020), the last tag.
# (14/11, owner's choice) the tag, not master: master (08/11/2026) was checked and gives byte-identical Krill binaries; its ca65 /
# ld65 changes since V2.19 are fixes for other CPUs and corner cases we do not use. zlib license.
CC65_VERSION=2.19
CC65_GIT=https://github.com/cc65/cc65.git
CC65_REF=555282497c3ecf8b313d87d5973093af19c35bd5

# cc1541: writes .d64 disks (Claus / Protovision). Latest release: 4.2 (28/02/2024). The upstream repository
# (bitbucket.org/PTV_Claus/cc1541) answered 404 on 14/11/2026: the source is the upstream tarball kept by Debian (.orig). MIT.
CC1541_VERSION=4.2
CC1541_URL=https://deb.debian.org/debian/pool/main/c/cc1541/cc1541_4.2.orig.tar.gz
CC1541_SHA256=550dd8c145b0896f12ee8ee9608ed93a684ec2727310d7500acc913e701f1e32

# ZX0: compressor by Einar Saukas. No tagged release: latest commit of the repository (17/12/2021, format v2). BSD-3.
ZX0_VERSION=2.2-20211217
ZX0_GIT=https://github.com/einar-saukas/ZX0.git
ZX0_REF=ecde3a2ae05061fe06469ed46df81a33b7de7d86

# KasmVNC: X server with web client for the viewer. Latest release: 1.5.2. Official .deb for the Ubuntu of the images (noble):
# building it from source needs its whole X server tree, so the package is unpacked instead (binaries only). GPL-2.0.
KASMVNC_VERSION=1.5.2
KASMVNC_URL=https://github.com/kasmtech/KasmVNC/releases/download/v1.5.2/kasmvncserver_ubuntu_noble_1.5.2_amd64.deb
KASMVNC_SHA256=89a5d1fbe9e032b122202be158a2b25f15c97e0a5b8dcf92a5e6835c7b7b2acd

# Matplotlib (+ NumPy, its dependency) for lab64-tools: from PyPI (pip, only in the py-build stage), 15/11, owner's choice: the
# Ubuntu package pulls SciPy, SymPy and unicode-data (~120 MB) through python3-fonttools. Latest on 15/11/2026. PSF-like / BSD-3.
MATPLOTLIB_VERSION=3.11.2
NUMPY_VERSION=2.5.4

# WeasyPrint: HTML + CSS -> PDF, for lab64-pdf-gen. Pure Python package from PyPI (pip, only in the build stage). Latest: 70.0. BSD-3.
WEASYPRINT_VERSION=70.0

# jsSID 0.9.1 by Hermit: SID emulator and player in JavaScript (Web Audio), for the player page of the viewer (sid.html). No tagged
# release on GitHub: latest commit (29/02/2016). License: WTFPL (README.txt). The image gets only jsSID.js and README.txt.
JSSID_VERSION=0.9.1-20160229
JSSID_GIT=https://github.com/og2t/jsSID.git
JSSID_REF=6ab1d70cb88326127dbf01a51a0ba4d50f77e732

# libresidfp, libsidplayfp, sidplayfp: SID player (console, renders .sid to WAV) for lab64-tools: the engine behind SID Studio's
